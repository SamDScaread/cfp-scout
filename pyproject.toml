[project]
name = "cfp-scout"
version = "0.1.0"
description = "MCP server that turns WikiCFP into typed agent tools and verifies conference deadlines on the official site, powered by TinyFish."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
cfp-scout = "cfp_scout.server:main"
cfp-scout-health = "cfp_scout.health:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfp_scout"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
